display_information:
  name: Agent Crew Kiro
  description: PM, Architect, Developer, Tester and Reviewer agents with approval gates
features:
  bot_user:
    display_name: agent-crew-kiro
    always_online: true
  slash_commands:
    - command: /crew
      description: Start a multi-agent run for a feature idea
      should_escape: false
      usage_hint: <feature idea>
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - files:write
  pkce_enabled: false
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  is_mcp_enabled: false
  token_rotation_enabled: false
  app_level_token_rotation_enabled: false